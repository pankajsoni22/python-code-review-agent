[project]
name = "python-code-review-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pankaj Soni", email = "pankajsoni.mgml@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
]

[project.scripts]
python-code-review-agent = "code_review_agent.main:main"

[tool.uv.build-backend]
module-name = "code_review_agent"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
